<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Checker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="card p-4 shadow">
        <h2 class="mb-4">Grade Checker</h2>
        <div class="mb-3">
            <label for="gradeInput" class="form-label">Enter your grade (0-100):</label>
            <input type="number" id="gradeInput" class="form-control" placeholder="e.g. 75">
        </div>
        <button onclick="checkGrade()" class="btn btn-primary">Check Result</button>
        <div id="resultArea" class="mt-4 fs-4 fw-bold"></div>
    </div>

    <script>
        // Registration of Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Registration failed:', err));
            });
        }

        function checkGrade() {
            const grade = document.getElementById('gradeInput').value;
            const resultArea = document.getElementById('resultArea');
            if (grade === "") {
                resultArea.innerHTML = '<span class="text-warning">Please enter a grade.</span>';
                return;
            }
            if (grade >= 60) {
                resultArea.innerHTML = '<span class="btn btn-primary disabled">Pass Tanda ka</span>';
            } else {
                resultArea.innerHTML = '<span class="btn btn-danger disabled">Failed Lawlaw ka</span>';
            }
        }
    </script>
</body>
</html>
